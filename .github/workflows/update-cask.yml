name: Update Grayslate cask

on:
  repository_dispatch:
    types: [grayslate-release]

permissions:
  contents: write

concurrency:
  group: update-grayslate-cask
  cancel-in-progress: false

jobs:
  update:
    name: Update stable cask
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.2.3; received ${RELEASE_TAG}." >&2
            exit 1
          fi
      - name: Download rendered cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${RELEASE_TAG}"
          --repo shriram-ethiraj/grayslate
          --pattern grayslate.rb
          --dir "${RUNNER_TEMP}/grayslate-cask"
      - name: Install and validate cask
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cask="${RUNNER_TEMP}/grayslate-cask/grayslate.rb"
          test -f "${cask}"
          grep -Fqx "  version \"${version}\"" "${cask}"
          grep -Eq '^  sha256 "[0-9a-f]{64}"$' "${cask}"
          grep -Fq "releases/download/v#{version}/Grayslate-#{version}-macos-universal-homebrew.dmg" "${cask}"
          ruby -c "${cask}"
          mkdir -p Casks
          install -m 0644 "${cask}" Casks/grayslate.rb
          brew style Casks/grayslate.rb
      - name: Publish cask update
        shell: bash
        run: |
          if git diff --quiet -- Casks/grayslate.rb; then
            echo "Cask already matches ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/grayslate.rb
          git commit -m "chore: update Grayslate to ${RELEASE_TAG#v}"
          git push
